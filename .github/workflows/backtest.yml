name: SAIL backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many calendar days back to test (try 365)"
        default: "365"
      capital:
        description: "Rupees per trade (try 20000, then 50000)"
        default: "20000"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run backtest
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          BACKTEST_DAYS: ${{ inputs.days }}
          BACKTEST_CAPITAL: ${{ inputs.capital }}
        run: python backtest.py
