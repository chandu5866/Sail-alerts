name: Learning study (trains the bot)

on:
  schedule:
    # 04:20 UTC Saturday = 9:50 AM IST Saturday
    - cron: "20 4 * * 6"
  workflow_dispatch:
    inputs:
      capital:
        description: "Rupees per trade (one trade at a time)"
        default: "200000"

permissions:
  contents: write

concurrency:
  group: learner
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Learn
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          BACKTEST_CAPITAL: ${{ inputs.capital || '200000' }}
        run: python ml.py learn

      - name: Save the model
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          [ -f ml_model.json ] && git add ml_model.json
          git diff --staged --quiet && exit 0
          git commit -m "learning study: new model"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            sleep 5
          done
          exit 1
