name: Weekly study (picks the 5 shares)

on:
  schedule:
    # 04:20 UTC Saturday = 9:50 AM IST Saturday
    - cron: "20 4 * * 6"
  workflow_dispatch:
    inputs:
      capital:
        description: "Rupees per trade"
        default: "20000"

permissions:
  contents: write

concurrency:
  group: trainer
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Study
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          BACKTEST_CAPITAL: ${{ inputs.capital }}
        run: python trainer.py

      - name: Save the picks
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          [ -f live_config.json ] && git add live_config.json
          git diff --staged --quiet && exit 0
          git commit -m "weekly study: new picks"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            sleep 5
          done
          exit 1
